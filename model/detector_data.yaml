# YOLO nose-detector dataset config (Ultralytics format).
#
# Lay out your labelled data like this, relative to `path` below:
#   data_detector/
#     images/train/*.jpg   labels/train/*.txt
#     images/val/*.jpg     labels/val/*.txt
#
# Each labels/*.txt holds one box per line, class 0 (nose), coords normalised:
#   0 <cx> <cy> <w> <h>
#
# Then: python train_detector.py --data detector_data.yaml

path: data_detector
train: images/train
val: images/val

names:
  0: nose
