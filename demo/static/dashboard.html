<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ella — Clinic Dashboard</title>
<style>
  :root {
    --bg:#0c0c0f; --bg2:#16161b; --cream:#f6f4ee; --panel:#ffffff; --ink:#15151a;
    --line:#e7e2d7; --line-dk:#2a2a31; --muted:#b7b2a8; --muted2:#6f6a60;
    --gold:#d9a94e; --scan:#ff3b4e; --ok:#4cc38a; --radius:16px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; color:var(--cream);
    background:radial-gradient(1200px 500px at 50% -10%, #20202a 0%, transparent 60%), linear-gradient(180deg,var(--bg),#090909);
    background-attachment:fixed; min-height:100vh;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:0 14px 44px; }
  .wrap { max-width:860px; margin:0 auto; }

  .topbar { display:flex; align-items:center; gap:12px; padding:16px 0 4px; flex-wrap:wrap; }
  .topbar .av { width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--cream); }
  .topbar h1 { font-size:18px; margin:0; flex:1; min-width:120px; }
  .topbar h1 small { color:var(--muted); font-weight:500; font-size:13px; display:block; }
  .nav a { color:var(--cream); text-decoration:none; font-size:14px; font-weight:600;
    border:1px solid var(--line-dk); padding:8px 13px; border-radius:10px; margin-left:8px; }
  .nav a.pri { background:var(--cream); color:var(--ink); border-color:var(--cream); }

  .clinicbar { display:flex; align-items:center; gap:10px; margin:14px 0 0; }
  .clinicbar select { flex:1; background:rgba(255,255,255,.06); border:1px solid var(--line-dk); color:var(--cream);
    padding:12px 13px; border-radius:12px; font-size:15px; -webkit-appearance:none; appearance:none; font-weight:600; }
  .vbadge { font-size:11px; font-weight:700; color:#1f7a50; background:rgba(76,195,138,.16); padding:5px 10px; border-radius:20px; white-space:nowrap; }

  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:14px 0 0; }
  @media (max-width:640px){ .tiles { grid-template-columns:repeat(2,1fr); } }
  .tile { background:rgba(255,255,255,.05); border:1px solid var(--line-dk); border-radius:14px; padding:16px; }
  .tile .n { font-size:28px; font-weight:800; line-height:1; }
  .tile .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin-top:7px; }
  .tile.gold .n { color:var(--gold); }

  .meter { margin:12px 0 0; background:rgba(255,255,255,.05); border:1px solid var(--line-dk); border-radius:14px; padding:16px; }
  .meter .row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .meter .lab { color:var(--muted); font-size:13px; }
  .meter .val { font-size:20px; font-weight:800; color:var(--ok); }
  .meter .bar { height:10px; background:var(--line-dk); border-radius:6px; margin-top:10px; overflow:hidden; }
  .meter .bar > span { display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--ok)); transition:width .4s; }

  .card { background:var(--panel); color:var(--ink); border-radius:16px; padding:18px; margin:14px 0 0; }
  .card h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .card h2 .paw { width:15px; height:15px; color:var(--gold); }
  .search { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:15px; margin:0 0 12px; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:var(--muted2); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; padding:0 8px 8px; }
  td { padding:10px 8px; border-top:1px solid var(--line); vertical-align:middle; }
  .uid { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--muted2); }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; display:inline-block; }
  .b-match { background:rgba(76,195,138,.16); color:#1f7a50; }
  .b-no { background:rgba(255,59,78,.14); color:#c0303c; }
  .b-ok { background:rgba(217,169,78,.18); color:#8a6a1f; }
  .ago { color:var(--muted2); font-size:12px; }
  .empty { color:var(--muted2); padding:14px 8px; }
  .pill { display:inline-flex; align-items:center; gap:7px; background:var(--cream); color:var(--ink);
    border-radius:20px; padding:7px 13px; font-size:13px; margin:0 8px 8px 0; text-decoration:none; }
  .pill .paw { width:13px; height:13px; color:var(--ink); }
  .pavatar { width:22px; height:22px; border-radius:50%; object-fit:cover; }
  .savatar { width:28px; height:28px; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:8px; }
  .chip { font-size:11px; color:var(--muted2); }

  /* mobile-first: turn the scans table into stacked cards on narrow screens */
  @media (max-width:600px) {
    table, thead, tbody, tr, td { display:block; }
    thead { display:none; }
    tr { border:1px solid var(--line); border-radius:12px; margin-bottom:10px; padding:4px 12px; }
    td { border:0; padding:8px 0; display:flex; justify-content:space-between; align-items:center; gap:14px; }
    td + td { border-top:1px solid var(--line); }
    td::before { content:attr(data-label); color:var(--muted2); font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="paw" viewBox="0 0 100 100">
    <ellipse cx="27" cy="41" rx="9" ry="12"/><ellipse cx="44" cy="28" rx="9" ry="13"/>
    <ellipse cx="62" cy="29" rx="9" ry="13"/><ellipse cx="79" cy="43" rx="9" ry="12"/>
    <path d="M50 50 C32 50 22 65 27 78 C31 89 45 91 50 91 C55 91 69 89 73 78 C78 65 68 50 50 50 Z"/>
  </symbol>
</svg>

<div class="wrap">
  <div class="topbar">
    <img class="av" src="/static/ella.jpg" alt="Ella">
    <h1>Ella<small>Vet clinic dashboard</small></h1>
    <div class="nav"><a href="/">Home</a><a class="pri" href="/scan">Scan</a></div>
  </div>

  <div class="clinicbar">
    <select id="clinicSel"><option value="">All clinics</option></select>
    <span class="vbadge" id="vbadge" style="display:none">✓ Verified</span>
  </div>

  <div class="tiles">
    <div class="tile"><div class="n" id="tPets">—</div><div class="l">Registered pets</div></div>
    <div class="tile gold"><div class="n" id="tMatches">—</div><div class="l">Pets found</div></div>
    <div class="tile"><div class="n" id="tEnroll">—</div><div class="l">Enrollments</div></div>
    <div class="tile"><div class="n" id="tToday">—</div><div class="l">Scans today</div></div>
  </div>

  <div class="meter">
    <div class="row"><span class="lab">Overall match rate (system-wide)</span><span class="val" id="mRate">—</span></div>
    <div class="bar"><span id="mBar" style="width:0%"></span></div>
  </div>

  <div class="card">
    <h2><svg class="paw"><use href="#paw"/></svg> Recent scans</h2>
    <table>
      <thead><tr><th>Pet</th><th>Action</th><th>Result</th><th>Match</th><th>When</th></tr></thead>
      <tbody id="scanRows"><tr><td class="empty" colspan="5">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2><svg class="paw"><use href="#paw"/></svg> Registry</h2>
    <input class="search" id="search" placeholder="Search by name or ID…">
    <div id="registry"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let clinic = "";          // "" = all clinics
let allPets = [];
let clinicsById = {};

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return Math.floor(s)+"s ago";
  if (s < 3600) return Math.floor(s/60)+"m ago";
  if (s < 86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
const badge = (o) => o==="match" ? '<span class="badge b-match">match</span>'
  : o==="no_match" ? '<span class="badge b-no">no match</span>'
  : '<span class="badge b-ok">'+o+'</span>';
const qs = () => clinic ? ("?clinic=" + encodeURIComponent(clinic)) : "";

function loadStats() {
  fetch("/api/stats" + qs()).then(r=>r.json()).then(d=>{
    $("tPets").textContent=d.pets; $("tMatches").textContent=d.matches;
    $("tEnroll").textContent=d.enrollments; $("tToday").textContent=d.today;
    $("mRate").textContent=d.match_rate+"%"; $("mBar").style.width=d.match_rate+"%";
  }).catch(()=>{});
}
function loadScans() {
  fetch("/api/scans" + qs()).then(r=>r.json()).then(d=>{
    const rows = d.scans;
    if (!rows.length) { $("scanRows").innerHTML='<tr><td class="empty">No scans yet for this clinic.</td></tr>'; return; }
    $("scanRows").innerHTML = rows.map(s => {
      const pct = s.similarity!=null ? Math.round(s.similarity*100)+"%" : "—";
      const av = s.photo_url ? `<img class="savatar" src="${s.photo_url}">` : "";
      const who = s.name ? `${av}<a href="/pet/${s.ella_uid}" style="color:inherit;text-decoration:none">${s.name}</a> <span class="uid">${s.ella_uid||""}</span>` : '<span class="uid">unknown</span>';
      return `<tr>
        <td data-label="Pet">${who}</td>
        <td data-label="Action">${s.action}</td>
        <td data-label="Result">${badge(s.outcome)}</td>
        <td data-label="Match">${pct}</td>
        <td data-label="When" class="ago">${ago(s.at)}</td></tr>`;
    }).join("");
  }).catch(()=>{});
}
function renderPets(q="") {
  const list = allPets.filter(p => (p.name+" "+p.ella_uid).toLowerCase().includes(q.toLowerCase()));
  $("registry").innerHTML = list.length ? list.map(p =>
    `<a class="pill" href="/pet/${p.ella_uid}">${p.photo_url ? `<img class="pavatar" src="${p.photo_url}">` : `<svg class="paw"><use href="#paw"/></svg>`}<b>${p.name}</b>
      <span class="uid">${p.ella_uid}</span></a>`).join("")
    : '<span class="chip">No pets yet.</span>';
}
function loadPets() {
  fetch("/api/pets" + qs()).then(r=>r.json()).then(d=>{ allPets=d.pets; renderPets($("search").value); }).catch(()=>{});
}
function loadAll() { loadStats(); loadScans(); loadPets();
  const c = clinicsById[clinic];
  $("vbadge").style.display = (c && c.verified) ? "" : "none";
}

// clinic selector
fetch("/api/clinics").then(r=>r.json()).then(d=>{
  const sel = $("clinicSel");
  d.clinics.forEach(c => { clinicsById[c.id]=c;
    const o=document.createElement("option"); o.value=c.id;
    o.textContent = c.name + (c.city ? " · "+c.city : "") + "  ("+c.pets+")"; sel.appendChild(o); });
}).catch(()=>{});
$("clinicSel").addEventListener("change", e => { clinic = e.target.value; loadAll(); });
$("search").addEventListener("input", e => renderPets(e.target.value));

loadAll();
</script>
</body>
</html>
