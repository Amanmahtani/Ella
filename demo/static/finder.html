<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ella — Found a pet</title>
<style>
  :root {
    --bg:#0c0c0f; --bg2:#16161b; --cream:#f6f4ee; --panel:#ffffff; --ink:#15151a;
    --line:#e7e2d7; --line-dk:#2a2a31; --muted:#b7b2a8; --muted2:#6f6a60;
    --gold:#d9a94e; --scan:#ff3b4e; --ok:#4cc38a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; color:var(--cream);
    background:radial-gradient(1000px 440px at 50% -10%, #20202a 0%, transparent 60%), linear-gradient(180deg,var(--bg),#090909);
    min-height:100vh; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:0 16px 48px; }
  .wrap { max-width:460px; margin:0 auto; }
  header { text-align:center; padding:30px 0 6px; }
  header .paw { font-size:34px; }
  header h1 { font-size:24px; margin:8px 0 0; }
  header p { color:var(--muted); font-size:14px; margin:4px 0 0; }
  .card { background:var(--panel); color:var(--ink); border-radius:18px; padding:22px; margin:20px 0 0; text-align:center; }
  .photo { width:150px; height:150px; border-radius:50%; object-fit:cover; margin:0 auto 14px; display:block;
    border:3px solid var(--cream); box-shadow:0 0 0 2px var(--line); }
  .ph-fallback { display:flex; align-items:center; justify-content:center; font-size:60px; background:var(--bg2); }
  .name { font-size:26px; font-weight:800; margin:0; }
  .meta { color:var(--muted2); font-size:14px; margin:4px 0 0; }
  .badge { display:inline-block; font-size:12px; font-weight:800; padding:5px 12px; border-radius:20px; margin:12px 0 0; }
  .b-lost { background:var(--scan); color:#fff; }
  .b-safe { background:rgba(76,195,138,.18); color:#1f7a50; }
  .notify { width:100%; margin-top:20px; background:var(--ok); color:#06120c; border:0; border-radius:14px;
    padding:16px; font-size:17px; font-weight:800; cursor:pointer; }
  .notify:disabled { opacity:.6; }
  .reunited { color:#1f7a50; font-weight:700; margin-top:16px; }
  .priv { color:var(--muted2); font-size:12px; margin-top:14px; }
  .err { text-align:center; color:var(--muted); padding:40px 10px; }
  .spin { display:inline-block; width:15px;height:15px;border:2px solid rgba(0,0,0,.3);border-top-color:#06120c;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;}
  @keyframes s { to { transform:rotate(360deg);} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="paw">🐾</div>
    <h1>You found a pet</h1>
    <p>Scanned an Ella tag. Here's who it belongs to.</p>
  </header>
  <div id="app"><div class="err">Looking up the tag…</div></div>
</div>
<script>
const code = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
const esc = (s)=>(s==null?"":String(s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function notify(uid, btn) {
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Alerting owner…';
  const fd = new FormData(); fd.append("ella_uid", uid);
  try {
    const d = await (await fetch("/api/relay",{method:"POST",body:fd})).json();
    btn.outerHTML = d.ok
      ? `<div class="reunited">✓ The owner has been alerted (${esc(d.masked)}). Thank you!</div>`
      : `<div class="err">${esc(d.error)}</div>`;
  } catch(e){ btn.disabled=false; btn.textContent="Notify the owner"; }
}

fetch("/api/tag?code=" + encodeURIComponent(code))
  .then(r=>r.json())
  .then(d=>{
    const app = document.getElementById("app");
    if (!d.ok || !d.found) {
      app.innerHTML = '<div class="card"><p class="meta">This tag isn\'t registered to a pet yet.</p></div>';
      return;
    }
    const photo = d.photo_url
      ? `<img class="photo" src="${esc(d.photo_url)}" alt="${esc(d.name)}">`
      : `<div class="photo ph-fallback">${d.species==="cat"?"🐱":"🐶"}</div>`;
    const badge = d.is_lost
      ? '<span class="badge b-lost">● Reported LOST</span>'
      : '<span class="badge b-safe">Has a home</span>';
    app.innerHTML = `<div class="card">
      ${photo}
      <h2 class="name">${esc(d.name)}</h2>
      <div class="meta">${esc(d.species||"pet")}${d.breed?" · "+esc(d.breed):""} · ${esc(d.ella_uid)}</div>
      <div>${badge}</div>
      <button class="notify" id="notifyBtn">Notify the owner</button>
      <div class="priv">🔒 The owner's contact details stay private. Tapping just sends them an alert that their pet was found.</div>
    </div>`;
    document.getElementById("notifyBtn").onclick = (e)=>notify(d.ella_uid, e.target);
  })
  .catch(()=>{ document.getElementById("app").innerHTML = '<div class="err">Could not read that tag.</div>'; });
</script>
</body>
</html>
